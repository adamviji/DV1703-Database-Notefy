<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notefy - Profile</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 1px solid black;
            padding: 20px;
            z-index: 1000;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Songs</a> |
        <a href="artists.html">Artists</a> |
        <input type="text" id="search-input" placeholder="Search songs or artists...">
        <button onclick="search()">Search</button> |
        <span id="nav-login"></span>
    </nav>

    <div id="not-logged-in" style="display:none;">
        <h2>You need to be logged in to view this page</h2>
        <a href="login.html">Login here</a>
    </div>

    <div id="profile-content" style="display:none;">
        <h1>Welcome, <span id="profile-username"></span>!</h1>

        <h2>Your Favorites</h2>
        <button onclick="deleteAccount()" style="color:red;">Delete Account</button>
        <table border="1">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Key</th>
                    <th>Difficulty</th>
                    <th>Year</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody id="favorites-table"></tbody>
        </table>
    </div>

    <!-- Modal -->
    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="song-modal">
        <h2 id="modal-title"></h2>
        <p><b>Artist:</b> <span id="modal-artist"></span></p>
        <p><b>Key:</b> <span id="modal-key"></span></p>
        <p><b>Difficulty:</b> <span id="modal-difficulty"></span></p>
        <p><b>Year:</b> <span id="modal-year"></span></p>
        <p><b>Chords:</b> <span id="modal-chords"></span></p>
        <button onclick="closeModal()">Close</button>
    </div>

    <script>
        const user_id = localStorage.getItem("user_id");
        const username = localStorage.getItem("username");

        if (user_id) {
            document.getElementById("nav-login").innerHTML =
                `Logged in as <b>${username}</b> | <a href="profile.html">Profile</a> | <a href="#" onclick="logout()">Logout</a>`;
        } else {
            document.getElementById("nav-login").innerHTML = `<a href="login.html">Login</a>`;
        }

        function logout() {
            localStorage.removeItem("user_id");
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }

        function search() {
            const term = document.getElementById("search-input").value;
            if (!term) return;
            window.location.href = `search.html?q=${encodeURIComponent(term)}`;
        }

        document.getElementById("search-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") search();
        });

        if (!user_id) {
            document.getElementById("not-logged-in").style.display = "block";
        } else {
            document.getElementById("profile-content").style.display = "block";
            document.getElementById("profile-username").textContent = username;
            loadFavorites();
        }

        async function loadFavorites() {
            const res = await fetch(`http://127.0.0.1:8000/favorites/${user_id}`);
            const songs = await res.json();
            const tbody = document.getElementById("favorites-table");
            tbody.innerHTML = "";

            if (songs.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6'>No favorites yet</td></tr>";
                return;
            }

            songs.forEach(song => {
                tbody.innerHTML += `
                    <tr>
                        <td><a href="#" onclick="showSongDetails(${song.Song_ID}, '${song.Title}', '${song.Artist}', '${song.original_key}', '${song.difficulty}', ${song.year})">${song.Title}</a></td>
                        <td>${song.Artist}</td>
                        <td>${song.original_key}</td>
                        <td>${song.difficulty}</td>
                        <td>${song.year}</td>
                        <td><button onclick="removeFavorite(${song.Song_ID})">Remove</button></td>
                    </tr>
                `;
            });
        }

        async function showSongDetails(song_id, title, artist, key, difficulty, year) {
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-artist").textContent = artist;
            document.getElementById("modal-key").textContent = key;
            document.getElementById("modal-difficulty").textContent = difficulty;
            document.getElementById("modal-year").textContent = year;
            document.getElementById("modal-chords").textContent = "Loading...";

            document.getElementById("overlay").style.display = "block";
            document.getElementById("song-modal").style.display = "block";

            const res = await fetch(`http://127.0.0.1:8000/songs/${song_id}/chords`);
            const chords = await res.json();
            document.getElementById("modal-chords").textContent = chords.map(c => c.Chords).join(" | ");
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("song-modal").style.display = "none";
        }

        async function deleteAccount() {
            if (!confirm("Are you sure you want to delete your account?")) return;
            await fetch(`http://127.0.0.1:8000/user/${user_id}`, {
                method: "DELETE"
            });
            localStorage.removeItem("user_id");
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }

        async function removeFavorite(song_id) {
            await fetch("http://127.0.0.1:8000/favorites", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: parseInt(user_id), song_id: song_id })
            });
            loadFavorites();
        }
    </script>
</body>

</html>

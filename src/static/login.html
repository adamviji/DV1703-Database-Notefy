<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notefy - Login</title>
</head>

<body>
    <nav>
        <a href="index.html">Songs</a> |
        <a href="artists.html">Artists</a> |
        <a href="login.html">Login</a> |
        <a href="profile.html">Profile</a>
    </nav>

    <div id="login-form">
        <h1>Login</h1>
        <input type="text" id="login-username" placeholder="Username"><br><br>
        <input type="password" id="login-password" placeholder="Password"><br><br>
        <button onclick="login()">Login</button>
        <p>Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
        <p id="login-error" style="color:red;"></p>
    </div>

    <div id="register-form" style="display:none;">
        <h1>Register</h1>
        <input type="text" id="reg-username" placeholder="Username"><br><br>
        <input type="email" id="reg-email" placeholder="Email"><br><br>
        <input type="password" id="reg-password" placeholder="Password"><br><br>
        <button onclick="register()">Register</button>
        <p>Already have an account? <a href="#" onclick="showLogin()">Login here</a></p>
        <p id="register-error" style="color:red;"></p>
        <p id="register-success" style="color:green;"></p>
    </div>

    <script>
        function showRegister() {
            document.getElementById("login-form").style.display = "none";
            document.getElementById("register-form").style.display = "block";
        }

        function showLogin() {
            document.getElementById("register-form").style.display = "none";
            document.getElementById("login-form").style.display = "block";
        }

        async function login() {
            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;

            const res = await fetch("http://127.0.0.1:8000/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                localStorage.setItem("user_id", data.user_id);
                localStorage.setItem("username", username);
                window.location.href = "index.html";
            } else {
                document.getElementById("login-error").textContent = data.detail;
            }
        }

        async function register() {
            const username = document.getElementById("reg-username").value;
            const email = document.getElementById("reg-email").value;
            const password = document.getElementById("reg-password").value;

            const res = await fetch("http://127.0.0.1:8000/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password })
            });

            const data = await res.json();
            if (res.ok) {
                document.getElementById("register-success").textContent = "Account created! You can now login.";
                document.getElementById("register-error").textContent = "";
            } else {
                document.getElementById("register-error").textContent = data.detail;
            }
        }
    </script>
</body>

</html>

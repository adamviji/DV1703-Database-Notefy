<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notefy</title>
</head>

<body>
<nav>
    <a href="index.html">Songs</a> |
    <a href="artists.html">Artists</a> |
    <input type="text" id="search-input" placeholder="Search songs or artists...">
    <button onclick="search()">Search</button> |
    <span id="nav-login"></span>
</nav>

    <h1>Notefy</h1>

    <h3>Filter by Genre</h3>
    <div id="genre-filters"></div>

    <h3>Filter by Difficulty</h3>
    <label><input type="checkbox" class="difficulty-filter" value="beginner"> Beginner</label>
    <label><input type="checkbox" class="difficulty-filter" value="intermediate"> Intermediate</label>
    <label><input type="checkbox" class="difficulty-filter" value="advanced"> Advanced</label>

    <h3>Songs</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Title</th>
                <th>Artist</th>
                <th>Genre</th>
                <th>Key</th>
                <th>Difficulty</th>
                <th>Year</th>
                <th id="fav-header"></th>
            </tr>
        </thead>
        <tbody id="songs-table"></tbody>
    </table>

    <script>
        const user_id = localStorage.getItem("user_id");
        const username = localStorage.getItem("username");

        // Navbar
        if (user_id) {
            document.getElementById("nav-login").innerHTML =
                `Logged in as <b>${username}</b> | <a href="profile.html">Profile</a> | <a href="#" onclick="logout()">Logout</a>`;
            document.getElementById("fav-header").textContent = "Favorite";
        } else {
            document.getElementById("nav-login").innerHTML = `<a href="login.html">Login</a>`;
        }

        function logout() {
            localStorage.removeItem("user_id");
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }

        let selectedGenres = [];
        let selectedDifficulties = [];

        async function loadGenres() {
            const res = await fetch("http://127.0.0.1:8000/genres");
            const genres = await res.json();
            const container = document.getElementById("genre-filters");
            genres.forEach(genre => {
                const label = document.createElement("label");
                label.innerHTML = `<input type="checkbox" value="${genre.Genre_ID}"> ${genre.Name} `;
                label.querySelector("input").addEventListener("change", (e) => {
                    if (e.target.checked) {
                        selectedGenres.push(genre.Genre_ID);
                    } else {
                        selectedGenres = selectedGenres.filter(id => id !== genre.Genre_ID);
                    }
                    loadSongs();
                });
                container.appendChild(label);
            });
        }

    async function loadSongs() {
        let url = "http://127.0.0.1:8000/songs/complete_tables?";
        if (selectedGenres.length > 0) url += `genre_ids=${selectedGenres.join(",")}&`;
        if (selectedDifficulties.length > 0) url += `difficulties=${selectedDifficulties.join(",")}&`;

        const res = await fetch(url);
        const songs = await res.json();
        const tbody = document.getElementById("songs-table");
        tbody.innerHTML = "";
        songs.forEach(song => {
            const favoriteBtn = user_id
                ? `<button onclick="addFavorite(${song.Song_ID})">★ Add</button>`
                : "";
            tbody.innerHTML += `
            <tr>
                <td>${song.Title}</td>
                <td>${song.Artist}</td>
                <td>${song.Genre}</td>
                <td>${song.original_key}</td>
                <td>${song.difficulty}</td>
                <td>${song.year}</td>
                <td>${favoriteBtn}</td>
            </tr>
        `;
        });
    }

        async function search() {
            const term = document.getElementById("search-input").value;
            if (!term) return;
            window.location.href = `search.html?q=${encodeURIComponent(term)}`;
        }

        document.getElementById("search-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") search();
        });

        async function addFavorite(song_id) {
            const res = await fetch("http://127.0.0.1:8000/favorites", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: parseInt(user_id), song_id: song_id })
            });
            if (res.ok) {
                alert("Added to favorites!");
            }
        }

        document.querySelectorAll(".difficulty-filter").forEach(cb => {
            cb.addEventListener("change", (e) => {
                if (e.target.checked) {
                    selectedDifficulties.push(e.target.value);
                } else {
                    selectedDifficulties = selectedDifficulties.filter(d => d !== e.target.value);
                }
                loadSongs();
            });
        });

        loadGenres();
        loadSongs();
    </script>
</body>

</html>

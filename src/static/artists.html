<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notefy - Artists</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 1px solid black;
            padding: 20px;
            z-index: 1000;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Songs</a> |
        <a href="artists.html">Artists</a> |
        <input type="text" id="search-input" placeholder="Search songs or artists...">
        <button onclick="search()">Search</button> |
        <span id="nav-login"></span>
    </nav>

    <h1>Artists</h1>

    <div id="artist-list"></div>

    <div id="artist-songs" style="display:none;">
        <h2 id="artist-name"></h2>
        <button onclick="goBack()">← Back to Artists</button>
        <table border="1">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Genre</th>
                    <th>Key</th>
                    <th>Difficulty</th>
                    <th>Year</th>
                    <th id="fav-header"></th>
                </tr>
            </thead>
            <tbody id="songs-table"></tbody>
        </table>
    </div>

    <!-- Modal -->
    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="song-modal">
        <h2 id="modal-title"></h2>
        <p><b>Artist:</b> <span id="modal-artist"></span></p>
        <p><b>Key:</b> <span id="modal-key"></span></p>
        <p><b>Difficulty:</b> <span id="modal-difficulty"></span></p>
        <p><b>Year:</b> <span id="modal-year"></span></p>
        <p><b>Chords:</b> <span id="modal-chords"></span></p>
        <button onclick="closeModal()">Close</button>
    </div>

    <script>
        const user_id = localStorage.getItem("user_id");
        const username = localStorage.getItem("username");

        if (user_id) {
            document.getElementById("nav-login").innerHTML =
                `Logged in as <b>${username}</b> | <a href="profile.html">Profile</a> | <a href="#" onclick="logout()">Logout</a>`;
        } else {
            document.getElementById("nav-login").innerHTML = `<a href="login.html">Login</a>`;
        }

        function logout() {
            localStorage.removeItem("user_id");
            localStorage.removeItem("username");
            window.location.href = "login.html";
        }

        function search() {
            const term = document.getElementById("search-input").value;
            if (!term) return;
            window.location.href = `search.html?q=${encodeURIComponent(term)}`;
        }

        document.getElementById("search-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") search();
        });

        async function loadArtists() {
            const res = await fetch("http://127.0.0.1:8000/artists");
            const artists = await res.json();
            const container = document.getElementById("artist-list");
            artists.forEach(artist => {
                const div = document.createElement("div");
                div.innerHTML = `<a href="#" onclick="loadArtistSongs('${artist.Artist}')">${artist.Artist}</a>`;
                container.appendChild(div);
            });
        }

        async function loadArtistSongs(artist) {
            const res = await fetch(`http://127.0.0.1:8000/artists/${encodeURIComponent(artist)}/songs`);
            const songs = await res.json();

            document.getElementById("artist-list").style.display = "none";
            document.getElementById("artist-songs").style.display = "block";
            document.getElementById("artist-name").textContent = artist;

            const tbody = document.getElementById("songs-table");
            tbody.innerHTML = "";
            songs.forEach(song => {
                const favoriteBtn = user_id
                    ? `<button onclick="addFavorite(${song.Song_ID})">★ Add</button>`
                    : "";
                tbody.innerHTML += `
                    <tr>
                        <td><a href="#" onclick="showSongDetails(${song.Song_ID}, '${song.Title}', '${artist}', '${song.original_key}', '${song.difficulty}', ${song.year})">${song.Title}</a></td>
                        <td>${song.Genre_ID}</td>
                        <td>${song.original_key}</td>
                        <td>${song.difficulty}</td>
                        <td>${song.year}</td>
                        <td>${favoriteBtn}</td>
                    </tr>
                `;
            });
        }

        async function showSongDetails(song_id, title, artist, key, difficulty, year) {
            document.getElementById("modal-title").textContent = title;
            document.getElementById("modal-artist").textContent = artist;
            document.getElementById("modal-key").textContent = key;
            document.getElementById("modal-difficulty").textContent = difficulty;
            document.getElementById("modal-year").textContent = year;
            document.getElementById("modal-chords").textContent = "Loading...";

            document.getElementById("overlay").style.display = "block";
            document.getElementById("song-modal").style.display = "block";

            const res = await fetch(`http://127.0.0.1:8000/songs/${song_id}/chords`);
            const chords = await res.json();
            document.getElementById("modal-chords").textContent = chords.map(c => c.Chords).join(" | ");
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("song-modal").style.display = "none";
        }

        async function addFavorite(song_id) {
            const res = await fetch("http://127.0.0.1:8000/favorites", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: parseInt(user_id), song_id: song_id })
            });
            if (res.ok) {
                alert("Added to favorites!");
            }
        }

        function goBack() {
            document.getElementById("artist-songs").style.display = "none";
            document.getElementById("artist-list").style.display = "block";
        }

        loadArtists();
    </script>
</body>

</html>
